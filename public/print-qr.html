<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yanni's Yard | Printable QR Card</title>
    <style>
      :root {
        --bg-1: #17110d;
        --bg-2: #261d18;
        --gold: #d7a75c;
        --gold-deep: #a96d2d;
        --ivory: #f7f0e7;
        --muted: rgba(247, 240, 231, 0.72);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(215, 167, 92, 0.22), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--ivory);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .poster {
        width: min(560px, 100%);
        padding: 28px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background: rgba(18, 14, 11, 0.88);
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(215, 167, 92, 0.32);
      }

      .brand-copy strong,
      .title {
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .brand-copy span,
      .subtitle,
      .footer,
      .url {
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      .hero {
        border-radius: 24px;
        padding: 24px 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(135deg, rgba(215, 167, 92, 0.12), rgba(255, 255, 255, 0.03));
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }

      .title span {
        color: var(--gold);
      }

      .subtitle {
        margin-top: 12px;
        line-height: 1.7;
      }

      .qr-wrap {
        display: grid;
        place-items: center;
        margin: 28px 0 18px;
      }

      .qr-code {
        width: min(360px, 100%);
        aspect-ratio: 1;
        display: block;
        border-radius: 24px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.3);
      }

      .url {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        word-break: break-all;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 22px;
        position: relative;
        z-index: 1;
      }

      .button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .primary {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        color: #fff;
      }

      .secondary {
        background: transparent;
        color: var(--ivory);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .footer {
        margin-top: 20px;
        text-align: center;
      }

      @page {
        size: A4;
        margin: 12mm;
      }

      @media print {
        body {
          padding: 0;
          background: #fff;
        }

        .poster {
          box-shadow: none;
          width: 100%;
          background: #fff;
          color: #111;
          border-color: #ddd;
        }

        .brand-copy span,
        .subtitle,
        .footer,
        .url {
          color: #555;
        }

        .hero {
          border-color: #ddd;
          background: #fff;
        }

        .url {
          border-color: #ddd;
          background: #fff;
        }

        .actions {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <header class="brand">
        <div class="brand-mark">Y</div>
        <div class="brand-copy">
          <strong>Yanni's Yard</strong>
          <span>Luxury hawassa dining</span>
        </div>
      </header>

      <section class="hero">
        <h1 class="title">Scan for the<br /><span>digital menu</span></h1>
        <div class="subtitle">Place this card on tables, counters, or receipts so guests can open the menu instantly.</div>

        <div class="qr-wrap">
          <img class="qr-code" src="qr-card.svg" alt="QR code for the Yanni's Yard menu" />
        </div>

        <div class="url">https://yanniyardmenu.netlify.app/</div>

        <div class="actions">
          <a class="button primary" href="qr-card.svg" download="yannis-yard-qr-card.svg">Download QR</a>
          <button class="button secondary" type="button" onclick="window.print()">Print card</button>
          <a class="button secondary" href="https://yanniyardmenu.netlify.app/" target="_blank" rel="noreferrer">Open menu</a>
        </div>

        <div class="footer">Best printed on white card or matte paper</div>
      </section>
    </main>
  </body>
</html>
