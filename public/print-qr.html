<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yanni's Yared | Printable QR Card</title>
    <style>
      :root {
        --bg-1: #17110d;
        --bg-2: #261d18;
        --gold: #d7a75c;
        --gold-deep: #a96d2d;
        --ivory: #f7f0e7;
        --muted: rgba(247, 240, 231, 0.72);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(215, 167, 92, 0.22), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--ivory);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .poster {
        width: min(560px, 100%);
        padding: 28px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background: rgba(18, 14, 11, 0.88);
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(215, 167, 92, 0.32);
      }

      .brand-copy strong,
      .title {
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .brand-copy span,
      .subtitle,
      .footer,
      .url {
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      .hero {
        border-radius: 24px;
        padding: 24px 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(135deg, rgba(215, 167, 92, 0.12), rgba(255, 255, 255, 0.03));
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }

      .title span {
        color: var(--gold);
      }

      .subtitle {
        margin-top: 12px;
        line-height: 1.7;
      }

      .qr-wrap {
        display: grid;
        place-items: center;
        margin: 28px 0 18px;
      }

      .qr-shell {
        position: relative;
        width: min(360px, 100%);
      }

      .qr-shell img.qr-code {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        border-radius: 24px;
        background: #fff;
        padding: 16px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.3);
      }

      .qr-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 84px;
        height: 84px;
        transform: translate(-50%, -50%);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.98);
        border: 4px solid rgba(255, 255, 255, 0.98);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        padding: 8px;
        object-fit: contain;
        pointer-events: none;
      }

      .url {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        word-break: break-all;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 22px;
      }

      .button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        color: #fff;
      }

      .secondary {
        background: transparent;
        color: var(--ivory);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .footer {
        margin-top: 20px;
        text-align: center;
      }

      @page {
        size: A4;
        margin: 12mm;
      }

      @media print {
        body {
          padding: 0;
          background: #fff;
        }

        .poster {
          box-shadow: none;
          width: 100%;
          background: #fff;
          color: #111;
          border-color: #ddd;
        }

        .brand-copy span,
        .subtitle,
        .footer,
        .url {
          color: #555;
        }

        .hero {
          border-color: #ddd;
          background: #fff;
        }

        .url {
          border-color: #ddd;
          background: #fff;
        }

        .actions {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <header class="brand">
        <div class="brand-mark">Y</div>
        <div class="brand-copy">
          <strong>Yanni's Yared</strong>
          <span>Luxury hawassa dining</span>
        </div>
      </header>

      <section class="hero">
        <h1 class="title">Scan for the<br /><span>digital menu</span></h1>
        <div class="subtitle">Place this card on tables, counters, or receipts so guests can open the menu instantly.</div>

        <div class="qr-wrap">
          <div class="qr-shell">
            <img id="menu-qr" class="qr-code" alt="QR code for the Yanni's Yared menu" />
            <img class="qr-logo" src="/yannis-logo.svg" alt="Yanni's Yared logo" />
          </div>
        </div>

        <div class="url">https://yanniyardmenu.netlify.app/</div>

        <div class="actions">
          <button class="button primary" type="button" id="download-btn">Download PNG</button>
          <button class="button secondary" type="button" onclick="window.print()">Print card</button>
          <button class="button secondary" type="button" onclick="window.open('https://yanniyardmenu.netlify.app/', '_blank')">Open menu</button>
        </div>

        <div class="footer">Best printed on white card or matte paper</div>
      </section>
    </main>

    <script>
      (function () {
        var menuUrl = 'https://yanniyardmenu.netlify.app/';
        var qrImage = document.getElementById('menu-qr');
        var downloadButton = document.getElementById('download-btn');
        var logoImage = new Image();
        logoImage.src = '/yannis-logo.svg';

        function waitForImage(image) {
          return new Promise(function (resolve, reject) {
            if (image.complete && image.naturalWidth) {
              resolve(image);
              return;
            }

            image.onload = function () { resolve(image); };
            image.onerror = function () { reject(new Error('Image failed to load')); };
          });
        }

        function drawRoundedRect(context, x, y, width, height, radius) {
          context.beginPath();
          context.moveTo(x + radius, y);
          context.arcTo(x + width, y, x + width, y + height, radius);
          context.arcTo(x + width, y + height, x, y + height, radius);
          context.arcTo(x, y + height, x, y, radius);
          context.arcTo(x, y, x + width, y, radius);
          context.closePath();
        }

        async function downloadPoster() {
          try {
            var qr = await waitForImage(qrImage);
            var logo = await waitForImage(logoImage);
            var canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 1600;
            var context = canvas.getContext('2d');

            context.fillStyle = '#120e0b';
            context.fillRect(0, 0, canvas.width, canvas.height);

            var margin = 72;
            var cardX = margin;
            var cardY = margin;
            var cardWidth = canvas.width - margin * 2;
            var cardHeight = canvas.height - margin * 2;

            drawRoundedRect(context, cardX, cardY, cardWidth, cardHeight, 36);
            context.fillStyle = '#1b1410';
            context.fill();

            drawRoundedRect(context, cardX + 36, cardY + 36, cardWidth - 72, 140, 28);
            context.fillStyle = '#2b2019';
            context.fill();

            context.fillStyle = '#f7f0e7';
            context.font = 'bold 42px Segoe UI, Arial, sans-serif';
            context.fillText("Yanni's Yared", cardX + 74, cardY + 92);
            context.font = '24px Segoe UI, Arial, sans-serif';
            context.fillStyle = 'rgba(247,240,231,0.75)';
            context.fillText('Luxury hawassa dining', cardX + 74, cardY + 130);

            drawRoundedRect(context, cardX + 92, cardY + 250, cardWidth - 184, cardWidth - 184, 40);
            context.fillStyle = '#fff';
            context.fill();

            var qrSize = cardWidth - 184;
            context.drawImage(qr, cardX + 92, cardY + 250, qrSize, qrSize);

            var logoSize = 170;
            var logoX = cardX + cardWidth / 2 - logoSize / 2;
            var logoY = cardY + 250 + qrSize / 2 - logoSize / 2;
            drawRoundedRect(context, logoX, logoY, logoSize, logoSize, 34);
            context.fillStyle = 'rgba(255,255,255,0.98)';
            context.fill();
            context.drawImage(logo, logoX + 16, logoY + 16, logoSize - 32, logoSize - 32);

            context.fillStyle = 'rgba(247,240,231,0.76)';
            context.font = '24px Segoe UI, Arial, sans-serif';
            context.textAlign = 'center';
            context.fillText('https://yanniyardmenu.netlify.app/', canvas.width / 2, cardY + 990);

            context.textAlign = 'center';
            context.font = 'bold 34px Segoe UI, Arial, sans-serif';
            context.fillStyle = '#d7a75c';
            context.fillText('Scan for the digital menu', canvas.width / 2, cardY + 1088);

            context.font = '22px Segoe UI, Arial, sans-serif';
            context.fillStyle = 'rgba(247,240,231,0.72)';
            context.fillText('Best printed on white card or matte paper', canvas.width / 2, cardY + 1140);

            var link = document.createElement('a');
            link.download = 'yannis-yared-qr-card.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          } catch (error) {
            alert('Unable to create the PNG right now. You can still use Print card and save as PDF.');
          }
        }

        if (qrImage) {
          qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=' + encodeURIComponent(menuUrl);
        }

        if (downloadButton) {
          downloadButton.addEventListener('click', downloadPoster);
        }
      }());
    </script>
  </body>
</html>
